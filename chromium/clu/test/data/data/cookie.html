<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cookie jar</title>
  </head>
  <body>
    <h1>Cookie jar</h1>
    <p>Cookie: <output id="cookie"></output></p>
    <script>
      // ?set=1 stores a cookie; every load shows what the page can read.
      if (new URLSearchParams(location.search).has('set')) document.cookie = 'clu_jar=oatmeal; max-age=3600; path=/'
      document.getElementById('cookie').textContent = document.cookie
    </script>
  </body>
</html>
