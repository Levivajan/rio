<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tone</title>
  </head>
  <body>
    <h1>Tone</h1>
    <script>
      // A quiet 220 Hz tone: startTone() needs a user gesture (executeJavaScript with userGesture true).
      let ctx = null
      window.startTone = async () => {
        ctx = new AudioContext()
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        gain.gain.value = 0.02
        osc.frequency.value = 220
        osc.connect(gain).connect(ctx.destination)
        osc.start()
        await ctx.resume()
        return ctx.state
      }
      window.stopTone = async () => {
        if (ctx) await ctx.close()
        ctx = null
        return 'stopped'
      }
    </script>
  </body>
</html>
